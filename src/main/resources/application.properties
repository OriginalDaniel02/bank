spring.application.name=bank
server.port=8080
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Generate a value with: openssl rand -base64 32

jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=15
jwt.refresh-token-days=7

# Email of the user to promote to ADMIN at startup (sign up first, then set this)
bank.admin-email=${ADMIN_EMAIL:}

# Transfer limits (naira) and fees. Fees are only charged when an income account is set.
bank.limits.per-transfer=5000000.00
bank.limits.daily-transfer=20000000.00
bank.limits.zone=Africa/Lagos
bank.fees.income-account-number=${FEE_INCOME_ACCOUNT:}
bank.fees.tier1-max=5000.00
bank.fees.tier1-fee=10.00
bank.fees.tier2-max=50000.00
bank.fees.tier2-fee=25.00
bank.fees.tier3-fee=50.00

# KYC: face verification provider. Leave unset until a real provider adapter is configured.
# 'stub' approves any image and is for local development only.
# kyc.face.provider=stub
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Limits for unverified (tier 0) users; verified users use bank.limits.* above.
bank.limits.tier0-per-transfer=20000.00
bank.limits.tier0-daily-transfer=50000.00

# Browser origins allowed to call the API directly (comma separated). Not needed in development (Vite proxies).
bank.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Card deposits through Paystack. Leave the key empty to switch deposits off.
# Use a TEST key (sk_test_...) until you go live. Never commit a real key: set it as an environment variable.
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
# Where Paystack sends the customer after paying (the frontend's address).
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:5173}
bank.deposits.min=100.00
bank.deposits.max=1000000.00
bank.deposits.tier0-max=50000.00

# Sign-in/sign-up requests allowed per minute from one address (in memory, per server).
bank.security.auth-requests-per-minute=60

# Face verification provider for the selfie identity check and new-device sign-in: 'smileid' (Smile ID SmartSelfie).
# Leave it unset to switch face checks off. 'stub' approves any photo and is for local development only.
# kyc.face.provider=smileid
smileid.partner-id=${SMILE_PARTNER_ID:}
smileid.api-key=${SMILE_API_KEY:}
# 0 = Smile ID sandbox, 1 = production
smileid.server=${SMILE_SERVER:0}
# Comma-separated Smile ID result codes that mean "passed". EMPTY BY DEFAULT: nothing is approved until you set it
# from what your Smile ID sandbox returns (the code is logged on every check).
smileid.approved-result-codes=${SMILE_APPROVED_RESULT_CODES:}
smileid.min-liveness-frames=7
