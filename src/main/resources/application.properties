spring.application.name=bank
server.port=8080
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Generate a value with: openssl rand -base64 32

jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=15
jwt.refresh-token-days=7

# Email of the user to promote to ADMIN at startup (sign up first, then set this)
bank.admin-email=${ADMIN_EMAIL:}

# Transfer limits (naira) and fees. Fees are only charged when an income account is set.
bank.limits.per-transfer=5000000.00
bank.limits.daily-transfer=20000000.00
bank.limits.zone=Africa/Lagos
bank.fees.income-account-number=${FEE_INCOME_ACCOUNT:}
bank.fees.tier1-max=5000.00
bank.fees.tier1-fee=10.00
bank.fees.tier2-max=50000.00
bank.fees.tier2-fee=25.00
bank.fees.tier3-fee=50.00
