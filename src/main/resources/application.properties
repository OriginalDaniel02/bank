spring.application.name=bank
server.port=8080
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Generate a value with: openssl rand -base64 32

jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=15
jwt.refresh-token-days=7
