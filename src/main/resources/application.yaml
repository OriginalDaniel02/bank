spring:
  config:
    import:
      optional:
        file: .env[.properties]
  application:
    name: bank
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: 15
  refresh-token-days: 7

bank:
  security:
    bvn-secret: ${BVN_HASH_SECRET}
  login:
    max-failed-attempts: 5
    lockout-minutes: 15
  limits:
    daily-debit-limit: 1000000.00
  interest:
    savings-annual-rate: 0.015
    accrual-cron: "0 0 1 * * *"
