spring:
    config:
          import:
                optional:
                    file: .env[.properties]
    application:
          name: bank
    datasource:
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
          username: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
    jpa:
      hibernate:
        ddl-auto: validate

      show-sql: true

      properties:
        hibernate:
          format_sql: true

server:
    port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: 15
  refresh-token-days: 7

bank:
  security:
      bvn-secret: ${BVN_HASH_SECRET}
